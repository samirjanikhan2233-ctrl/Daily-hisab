<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Hisab</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F3D3E">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7EE;--card:#fff;--ink:#1d2a2a;--mute:#6b7775;--teal:#0F3D3E;--teal2:#1c6b69;--gold:#F2A93B;--line:#e6dfcf;--red:#c2412d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1716;--card:#182726;--ink:#eef3f1;--mute:#93a5a2;--teal:#1c6b69;--teal2:#2a8f8c;--line:#2a3b39}}
:root[data-theme="dark"]{--bg:#0e1716;--card:#182726;--ink:#eef3f1;--mute:#93a5a2;--teal:#1c6b69;--teal2:#2a8f8c;--line:#2a3b39}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.4 "Baloo 2","Noto Naskh Arabic","Noto Sans Devanagari",system-ui,sans-serif;max-width:520px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
h1{font-size:26px;margin:0;font-weight:800}
.sub{color:var(--mute);font-size:13px;margin:0}
button,input,select{font:inherit;color:inherit}
.ic{border:1px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer}
.hr{display:flex;gap:8px;align-items:center}
#lang{width:auto;max-width:110px;font-size:14px;padding:0 6px;color:var(--ink)}
.scene{perspective:900px;margin:10px 0 16px}
.flip{position:relative;height:150px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);cursor:pointer;animation:intro 1.4s cubic-bezier(.2,.8,.2,1)}
.flip.back{transform:rotateX(180deg)}
@keyframes intro{from{transform:rotateX(-70deg) rotateY(40deg) scale(.7);opacity:0}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,var(--teal),var(--teal2));box-shadow:0 18px 30px -12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);display:flex;flex-direction:column;justify-content:center}
.face.b{transform:rotateX(180deg);background:linear-gradient(135deg,#8a5a10,var(--gold))}
.face small{opacity:.85;font-size:14px}
.face strong{font-size:44px;line-height:1.1;font-weight:800;transform:translateZ(30px)}
.face em{font-style:normal;font-size:12px;opacity:.8;position:absolute;right:16px;bottom:10px}
[dir=rtl] .face em{right:auto;left:16px}
.coin{position:absolute;right:20px;top:18px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffe29a,var(--gold));display:grid;place-items:center;color:#7a4b00;font-weight:800;animation:spin 4s linear infinite;box-shadow:0 4px 8px rgba(0,0,0,.3)}
[dir=rtl] .coin{right:auto;left:20px}
@keyframes spin{to{transform:rotateY(360deg)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.panel h2{font-size:18px;margin:0 0 10px;font-weight:700}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mute)}
input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);margin-top:2px}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.full{grid-column:1/-1}
.go{width:100%;height:52px;border:0;border-radius:14px;background:var(--gold);color:#3a2500;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 6px 0 #b9781a;transition:transform .1s,box-shadow .1s;margin-top:10px}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 #b9781a}
.ghost{background:none;border:1.5px solid var(--line);border-radius:12px;height:44px;padding:0 14px;cursor:pointer;background:var(--card)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:12px 0 6px}
ul{list-style:none;margin:0;padding:0;perspective:800px}
li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px dashed var(--line)}
li.new{animation:drop .6s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:rotateX(-80deg) translateY(-20px);opacity:0}}
.nm{flex:1;min-width:0}.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm span{font-size:12px;color:var(--mute)}
.amt{font-weight:800}
.sm{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.empty{color:var(--mute);text-align:center;padding:18px 0}
details summary{cursor:pointer;font-weight:700}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:10px;margin-top:8px;font-size:12px}
footer{text-align:center;color:var(--mute);font-size:13px;margin-top:18px}
#msg{min-height:20px;color:var(--teal2);font-size:14px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div><h1>Daily Hisab</h1><p class="sub" data-i="sub"></p></div>
  <div class="hr">
    <select id="lang" class="ic" aria-label="Language">
      <option value="rur">Roman Urdu</option>
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="ur">اردو</option>
      <option value="ar">العربية</option>
    </select>
    <button class="ic" id="theme" data-a="theme">🌓</button>
  </div>
</header>

<div class="scene"><div class="flip" id="flip" role="button" tabindex="0" data-a="flip">
  <div class="face"><span class="coin">Rs</span><small data-i="today"></small><strong id="tToday">0</strong><em data-i="tapM"></em></div>
  <div class="face b"><small data-i="monL"></small><strong id="tMonth">0</strong><em data-i="tapB"></em></div>
</div></div>

<section class="panel">
  <h2 id="formTitle"></h2>
  <div class="row">
    <label class="full"><span data-i="name"></span><input id="name" data-p="nameph" autocomplete="off"></label>
    <label><span data-i="qty"></span><input id="qty" type="number" inputmode="decimal" value="1" min="0" step="any"></label>
    <label><span data-i="price"></span><input id="price" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
    <label class="full"><span data-i="date"></span><input id="date" type="date"></label>
  </div>
  <button class="go" id="save"></button>
  <button class="ghost" id="cancel" data-i="cancel" style="display:none;width:100%;margin-top:10px"></button>
  <div id="msg" role="status"></div>
</section>

<section class="panel">
  <h2 data-i="rec"></h2>
  <div class="tools">
    <label><span data-i="month"></span><input id="month" type="month"></label>
    <label><span data-i="search"></span><input id="q" type="search" data-p="searchph"></label>
  </div>
  <div class="sum"><span data-i="total"></span><span id="listTotal">0</span></div>
  <ul id="list"></ul>
</section>

<section class="panel">
  <details><summary data-i="bkS"></summary>
    <p class="sub" style="margin-top:8px" data-i="bkN"></p>
    <div class="tools"><button class="ghost" id="bk" data-i="bk"></button><button class="ghost" id="rs" data-i="rs"></button></div>
    <textarea id="box" data-p="boxph"></textarea>
  </details>
</section>
<section class="panel">
  <details><summary data-i="about"></summary>
    <p data-i="aboutP"></p>
    <p><b data-i="dev"></b> MuhammadSamirKhankabir</p>
  </details>
</section>
<footer><span data-i="dev"></span> MuhammadSamirKhankabir</footer>

};
var L="rur",KEY="dailyhisab.v1",data=[],editId=null,$=function(i){return document.getElementById(i)};
function t(k){return (T[L]&&T[L][k])||T.rur[k]||k}
function setLang(l,norender){
  if(!T[l])l="rur";L=l;try{localStorage.setItem("dailyhisab.lang",l)}catch(e){}
  var r=document.documentElement;r.lang=l==="rur"?"ur-Latn":l;r.dir=(l==="ur"||l==="ar")?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.dataset.i)});
  document.querySelectorAll("[data-p]").forEach(function(e){e.placeholder=t(e.dataset.p)});
  document.querySelectorAll("[data-a]").forEach(function(e){e.setAttribute("aria-label",t(e.dataset.a))});
  $("lang").value=l;
  $("formTitle").textContent=t(editId?"et":"ft");$("save").textContent=t(editId?"es":"sb");
  if(!norender)render();
}
function load(){try{data=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){data=[]}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){say(t("sf"))}}
function pad(n){return n<10?"0"+n:""+n}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmt(n){return (Math.round(n*100)/100).toLocaleString("en-US")}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var msgT;function say(m){$("msg").textContent=m;clearTimeout(msgT);msgT=setTimeout(function(){$("msg").textContent=""},2500)}
function sum(a){return a.reduce(function(s,e){return s+e.qty*e.price},0)}
function render(newId){
  var m=$("month").value||today().slice(0,7),q=$("q").value.trim().toLowerCase();
  var tt=today();
  $("tToday").textContent=fmt(sum(data.filter(function(e){return e.date===tt})));
  $("tMonth").textContent=fmt(sum(data.filter(function(e){return e.date.slice(0,7)===today().slice(0,7)})));
  var rows=data.filter(function(e){return e.date.slice(0,7)===m&&(!q||e.name.toLowerCase().indexOf(q)>-1)})
    .sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id});
  $("listTotal").textContent=fmt(sum(rows));
  $("list").innerHTML=rows.length?rows.map(function(e){
    return '<li class="'+(e.id===newId?'new':'')+'"><div class="nm"><b>'+esc(e.name)+'</b><span dir="ltr">'+e.date+' · '+fmt(e.qty)+' × '+fmt(e.price)+'</span></div><span class="amt">'+fmt(e.qty*e.price)+'</span><button class="sm" data-e="'+e.id+'" aria-label="'+t("edit")+'">✏️</button><button class="sm" data-d="'+e.id+'" aria-label="'+t("del")+'">🗑️</button></li>';
  }).join(""):'<li class="empty">'+t("empty")+'</li>';
}
function reset(){editId=null;$("name").value="";$("qty").value=1;$("price").value="";$("date").value=today();$("formTitle").textContent=t("ft");$("save").textContent=t("sb");$("cancel").style.display="none"}
$("save").onclick=function(){
  var name=$("name").value.trim(),qty=parseFloat($("qty").value),price=parseFloat($("price").value),date=$("date").value||today();
  if(!name){say(t("nn"));$("name").focus();return}
  if(!(qty>=0)||!(price>=0)){say(t("bn"));return}
  var id;
  if(editId){id=editId;data=data.map(function(e){return e.id===editId?{id:id,name:name,qty:qty,price:price,date:date}:e});say(t("ed"))}
  else{id=Date.now();data.push({id:id,name:name,qty:qty,price:price,date:date});say(t("sv"))}
  store();$("month").value=date.slice(0,7);reset();render(id);
};
$("cancel").onclick=reset;
$("list").onclick=function(ev){
  var b=ev.target.closest("button");if(!b)return;
  if(b.dataset.d){if(confirm(t("cd"))){data=data.filter(function(e){return String(e.id)!==b.dataset.d});store();render()}}
  if(b.dataset.e){var e=data.filter(function(x){return String(x.id)===b.dataset.e})[0];if(!e)return;
    editId=e.id;$("name").value=e.name;$("qty").value=e.qty;$("price").value=e.price;$("date").value=e.date;
    $("formTitle").textContent=t("et");$("save").textContent=t("es");$("cancel").style.display="block";window.scrollTo({top:0,behavior:"smooth"})}
};
$("month").onchange=function(){render()};$("q").oninput=function(){render()};
$("lang").onchange=function(){setLang(this.value)};
var fl=$("flip");function tog(){fl.classList.toggle("back")}
fl.onclick=tog;fl.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tog()}};
$("theme").onclick=function(){
  var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("dailyhisab.theme",r.dataset.theme)}catch(e){}
};
try{var th=localStorage.getItem("dailyhisab.theme");if(th)document.documentElement.dataset.theme=th}catch(e){}
$("bk").onclick=function(){
  var x=JSON.stringify(data);$("box").value=x;$("box").select();
  try{navigator.clipboard.writeText(x).then(function(){say(t("bo"))},function(){say(t("bm"))})}catch(e){say(t("bm"))}
};
$("rs").onclick=function(){
  try{var a=JSON.parse($("box").value);if(!Array.isArray(a))throw 0;
    a=a.filter(function(e){return e&&e.name&&e.date&&isFinite(e.qty)&&isFinite(e.price)});
    if(!confirm(t("rc").replace("{n}",a.length)))return;
    data=a.map(function(e,i){return {id:e.id||Date.now()+i,name:String(e.name),qty:+e.qty,price:+e.price,date:String(e.date)}});
    store();render();say(t("rd"))}catch(e){say(t("bb"))}
};
var sc=document.querySelector(".scene");
sc.addEventListener("pointermove",function(e){if(fl.classList.contains("back"))return;var r=sc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;fl.style.animation="none";fl.style.transform="rotateY("+x*18+"deg) rotateX("+(-y*14)+"deg)"});
sc.addEventListener("pointerleave",function(){if(!fl.classList.contains("back"))fl.style.transform=""});
fl.addEventListener("click",function(){fl.style.transform=""});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
var sl="rur";try{sl=localStorage.getItem("dailyhisab.lang")||"rur"}catch(e){}
load();$("month").value=today().slice(0,7);reset();setLang(sl);
})();
</script>
</body>
</html>
