<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c3a">
<title>Daily Hisab</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#eef3f0;--card:#fff;--ink:#14201b;--mute:#5d6f67;--line:#d9e3de;--green:#0f4c3a;--green2:#1b7a5c;--gold:#c8962e;--red:#c0392b;--ok:#1b7a5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1612;--card:#16231d;--ink:#e8f1ec;--mute:#93a79d;--line:#27382f;--green:#2fa57d;--green2:#3cc195}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.hide{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h1,h2,h3{margin:0}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--green);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.danger{background:var(--red)}
button.full{width:100%;margin-top:14px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.ok{color:var(--ok)}
/* auth */
#auth{min-height:100vh;display:flex;align-items:center}
#auth .wrap{width:100%}
.brand{text-align:center;margin-bottom:18px}
.brand svg{width:84px;height:84px}
.brand h1{font-size:28px;margin-top:8px;color:var(--green)}
.brand p{margin:2px 0 0;color:var(--mute)}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:6px}
.tabs button{flex:1;background:transparent;color:var(--mute)}
.tabs button.on{background:var(--green);color:#fff}
/* top */
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.top svg{width:38px;height:38px}
.top h2{flex:1;font-size:19px}
.top small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.icon{padding:9px 12px}
/* summary */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.sum span{font-size:12.5px;color:var(--mute)}
.sum b{display:block;font-size:20px;margin-top:2px}
.neg{color:var(--red)}.pos{color:var(--ok)}
.bar{height:12px;background:var(--bg);border-radius:8px;overflow:hidden;margin:10px 0 6px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--green2);width:0;transition:width .3s}
.bar i.warn{background:var(--gold)}.bar i.over{background:var(--red)}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:transparent;color:var(--mute);border:1.5px solid var(--line)}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.seg button.on.inc{background:var(--ok)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
ul{list-style:none;margin:0;padding:0}
li.tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
li.tx:last-child{border:0}
li.tx .m{flex:1;min-width:0}
li.tx .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.tx .m small{color:var(--mute)}
li.tx .a{font-weight:700;white-space:nowrap}
li.tx button{padding:7px 10px;background:transparent;color:var(--red);border:1.5px solid var(--line);font-size:14px}
.empty{color:var(--mute);text-align:center;padding:18px 0}
.sethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="logo" viewBox="0 0 120 120">
      <defs>
        <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b7a5c"/><stop offset="1" stop-color="#0a3328"/></linearGradient>
        <linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3cf6e"/><stop offset="1" stop-color="#c8962e"/></linearGradient>
      </defs>
      <rect width="120" height="120" rx="28" fill="url(#lg1)"/>
      <rect x="27" y="22" width="56" height="74" rx="8" fill="#f6f8f7"/>
      <rect x="27" y="22" width="12" height="74" rx="6" fill="#0f4c3a" opacity=".18"/>
      <g stroke="#9db8ac" stroke-width="3" stroke-linecap="round"><line x1="46" y1="40" x2="74" y2="40"/><line x1="46" y1="52" x2="74" y2="52"/><line x1="46" y1="64" x2="62" y2="64"/></g>
      <circle cx="80" cy="82" r="22" fill="url(#lg2)" stroke="#fff" stroke-width="4"/>
      <path d="M71 74h18M71 81h18M74 74c9 0 9 10 0 10l11 11" fill="none" stroke="#0a3328" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<!-- LOGIN / SIGN UP -->
<section id="auth" class="hide">
  <div class="wrap">
    <div class="brand">
      <svg><use href="#logo"/></svg>
      <h1>Daily Hisab</h1>
      <p>Roz ka hisab, apne phone mein</p>
    </div>
    <div class="card">
      <div class="tabs">
        <button id="tLogin" class="on" type="button">Login</button>
        <button id="tSign" type="button">Sign up</button>
      </div>
      <div id="nameBox" class="hide">
        <label for="aName">Apna naam</label>
        <input id="aName" autocomplete="name" placeholder="Jaise: Ali">
      </div>
      <label for="aUser">Username</label>
      <input id="aUser" autocomplete="username" autocapitalize="none" placeholder="username">
      <label for="aPass">Password</label>
      <input id="aPass" type="password" autocomplete="current-password" placeholder="kam az kam 4 harf">
      <div id="passBox" class="hide">
        <label for="aPass2">Password dobara likhein</label>
        <input id="aPass2" type="password" autocomplete="new-password">
      </div>
      <div id="aErr" class="err" role="alert"></div>
      <button id="aGo" class="full" type="button">Login karein</button>
    </div>
    <p style="text-align:center;color:var(--mute);font-size:13px">Data sirf is phone/browser mein save hota hai.</p>
  </div>
</section>

<!-- APP -->
<section id="app" class="hide">
  <div class="wrap">
    <div class="top">
      <svg><use href="#logo"/></svg>
      <h2>Daily Hisab<small id="hello"></small></h2>
      <button class="ghost icon" id="bSet" type="button" aria-label="Settings">⚙️</button>
      <button class="ghost icon" id="bOut" type="button">Logout</button>
    </div>

    <div id="home">
      <div class="row2" style="margin-bottom:10px">
        <div><label for="fMonth" style="margin-top:0">Mahina</label><input id="fMonth" type="month"></div>
      </div>
      <div class="sum">
        <div><span>Is mahine ka kharcha</span><b id="sOut">0</b></div>
        <div><span>Is mahine ki amdani</span><b id="sIn" class="pos">0</b></div>
        <div><span>Aaj ka kharcha</span><b id="sToday">0</b></div>
        <div><span>Bachat</span><b id="sNet">0</b></div>
      </div>

      <div class="card" style="margin-top:12px">
        <div class="sethead"><h3>Budget</h3><span id="bTxt" style="color:var(--mute);font-size:14px"></span></div>
        <div class="bar"><i id="bBar"></i></div>
        <div id="bMsg" style="font-size:14px;color:var(--mute)">Settings mein monthly budget set karein.</div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:10px">Nayi entry</h3>
        <div class="seg">
          <button type="button" id="kOut" class="on">Kharcha</button>
          <button type="button" id="kIn" class="inc">Amdani</button>
        </div>
        <div class="row2">
          <div><label for="xAmt">Raqam</label><input id="xAmt" type="number" inputmode="decimal" min="0" placeholder="0"></div>
          <div><label for="xDate">Tareekh</label><input id="xDate" type="date"></div>
        </div>
        <label for="xCat">Category</label>
        <select id="xCat"></select>
        <label for="xNote">Tafseel (optional)</label>
        <input id="xNote" maxlength="80" placeholder="Jaise: sabzi, bijli bill">
        <div id="xErr" class="err" role="alert"></div>
        <button id="xAdd" class="full" type="button">Save karein</button>
      </div>

      <div class="card">
        <h3 style="margin-bottom:4px">Entries</h3>
        <ul id="list"></ul>
      </div>
    </div>

    <div id="settings" class="hide">
      <div class="card">
        <h3>Settings</h3>
        <label for="sName">Naam</label><input id="sName">
        <label for="sCur">Currency</label>
        <select id="sCur"><option>Rs</option><option>PKR</option><option>₹</option><option>$</option><option>AED</option><option>SAR</option></select>
        <label for="sBud">Monthly budget</label><input id="sBud" type="number" inputmode="decimal" min="0" placeholder="0">
        <div id="sMsg" class="err"></div>
        <button class="full" id="sSave" type="button">Save settings</button>
      </div>
      <div class="card">
        <h3>Password badlein</h3>
        <label for="pOld">Purana password</label><input id="pOld" type="password" autocomplete="current-password">
        <label for="pNew">Naya password</label><input id="pNew" type="password" autocomplete="new-password">
        <div id="pMsg" class="err"></div>
        <button class="full ghost" id="pSave" type="button">Password badlein</button>
      </div>
      <div class="card">
        <h3>Data</h3>
        <button class="full ghost" id="dBack" type="button">Backup download karein</button>
        <button class="full danger" id="dClear" type="button">Saari entries delete karein</button>
      </div>
      <button class="full ghost" id="sBack" type="button">← Wapis</button>
    </div>
  </div>
</section>
<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var mem={};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return k in mem?mem[k]:d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}

var CATS={out:["Khana","Ghar/Kiraya","Bijli/Gas/Pani","Safar","Kapre","Sehat","Taleem","Mobile/Internet","Bachon ka","Udhaar","Other"],in:["Tankhwah","Karobar","Udhaar wapsi","Gift","Other"]};
var kind="out",me=null,data=null,authMode="login";

function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},1800)}
function fmt(n){return (data?data.cur:"Rs")+" "+Number(n).toLocaleString("en-US",{maximumFractionDigits:2})}

async function hash(p){
  try{if(window.crypto&&crypto.subtle){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("dh:"+p));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}}catch(e){}
  return "b:"+btoa(unescape(encodeURIComponent("dh:"+p)));
}
function saveData(){lsSet("dh_data_"+me,data)}

/* ---------- AUTH ---------- */
function setMode(m){
  authMode=m;var s=m==="signup";
  $("tLogin").classList.toggle("on",!s);$("tSign").classList.toggle("on",s);
  $("nameBox").classList.toggle("hide",!s);$("passBox").classList.toggle("hide",!s);
  $("aGo").textContent=s?"Account banayein":"Login karein";
  $("aPass").autocomplete=s?"new-password":"current-password";
  $("aErr").textContent="";
}
async function doAuth(){
  var u=$("aUser").value.trim().toLowerCase(),p=$("aPass").value,err=$("aErr");
  err.textContent="";
  if(!u){err.textContent="Username likhein.";return}
  if(!/^[a-z0-9_.]{3,20}$/.test(u)){err.textContent="Username 3-20 harf: a-z, 0-9, _ ya . hi use karein.";return}
  if(p.length<4){err.textContent="Password kam az kam 4 harf ka ho.";return}
  var users=lsGet("dh_users",{});
  if(authMode==="signup"){
    if(users[u]){err.textContent="Ye username pehle se maujood hai. Login karein.";return}
    if(p!==$("aPass2").value){err.textContent="Dono password aik jaise nahi hain.";return}
    var nm=$("aName").value.trim()||u;
    users[u]={h:await hash(p),name:nm};lsSet("dh_users",users);
    lsSet("dh_data_"+u,{tx:[],budget:0,cur:"Rs",name:nm});
  }else{
    if(!users[u]){err.textContent="Ye username nahi mila. Pehle Sign up karein.";return}
    if(users[u].h!==await hash(p)){err.textContent="Password ghalat hai.";return}
  }
  lsSet("dh_session",u);
  $("aPass").value="";$("aPass2").value="";
  start(u);
}

/* ---------- START / SCREENS ---------- */
function start(u){
  me=u;data=lsGet("dh_data_"+u,null)||{tx:[],budget:0,cur:"Rs"};
  if(!data.tx)data.tx=[];
  var users=lsGet("dh_users",{});
  $("hello").textContent="Salam, "+((users[u]&&users[u].name)||u);
  $("auth").classList.add("hide");$("app").classList.remove("hide");
  $("fMonth").value=today().slice(0,7);$("xDate").value=today();
  setKind("out");showHome();
}
function showHome(){$("settings").classList.add("hide");$("home").classList.remove("hide");render()}
function showSet(){
  $("home").classList.add("hide");$("settings").classList.remove("hide");
  var users=lsGet("dh_users",{});
  $("sName").value=(users[me]&&users[me].name)||"";$("sCur").value=data.cur||"Rs";$("sBud").value=data.budget||"";
  $("sMsg").textContent="";$("pMsg").textContent="";
}
function logout(){lsDel("dh_session");me=null;data=null;$("app").classList.add("hide");$("auth").classList.remove("hide");setMode("login")}

/* ---------- ENTRIES ---------- */
function setKind(k){
  kind=k;$("kOut").classList.toggle("on",k==="out");$("kIn").classList.toggle("on",k==="in");
  var s=$("xCat");s.innerHTML="";
  CATS[k].forEach(function(c){var o=document.createElement("option");o.textContent=c;s.appendChild(o)});
}
function addTx(){
  var amt=parseFloat($("xAmt").value),err=$("xErr");err.textContent="";
  if(!(amt>0)){err.textContent="Sahi raqam likhein.";$("xAmt").focus();return}
  var d=$("xDate").value||today();
  data.tx.push({id:Date.now()+""+Math.floor(Math.random()*1000),k:kind,a:amt,c:$("xCat").value,n:$("xNote").value.trim(),d:d});
  saveData();
  $("xAmt").value="";$("xNote").value="";$("xDate").value=today();   // form saaf
  $("fMonth").value=d.slice(0,7);
  render();toast("Save ho gaya ✓");
}
function delTx(id){
  if(!confirm("Ye entry delete karein?"))return;
  data.tx=data.tx.filter(function(t){return t.id!==id});
  saveData();render();toast("Delete ho gaya");
}
function render(){
  var m=$("fMonth").value||today().slice(0,7),t0=today();
  var out=0,inc=0,td=0,mtx=[];
  data.tx.forEach(function(t){
    if(t.d.slice(0,7)===m){mtx.push(t);if(t.k==="out")out+=t.a;else inc+=t.a}
    if(t.k==="out"&&t.d===t0)td+=t.a;
  });
  $("sOut").textContent=fmt(out);$("sIn").textContent=fmt(inc);$("sToday").textContent=fmt(td);
  var net=inc-out,sn=$("sNet");sn.textContent=fmt(net);sn.className=net<0?"neg":"pos";
  // budget
  var b=Number(data.budget)||0,bar=$("bBar");
  if(b>0){
    var p=out/b*100;bar.style.width=Math.min(100,p)+"%";bar.className=p>=100?"over":p>=80?"warn":"";
    $("bTxt").textContent=fmt(out)+" / "+fmt(b);
    $("bMsg").textContent=p>=100?"Budget khatam! "+fmt(out-b)+" zyada kharch ho gaya.":fmt(b-out)+" bacha hai ("+Math.round(p)+"% kharch).";
  }else{bar.style.width="0";$("bTxt").textContent="";$("bMsg").textContent="Settings mein monthly budget set karein."}
  // list
  var ul=$("list");ul.innerHTML="";
  mtx.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id<a.id?-1:1});
  if(!mtx.length){var e=document.createElement("div");e.className="empty";e.textContent="Is mahine koi entry nahi. Upar se pehli entry likhein.";ul.appendChild(e);return}
  mtx.forEach(function(t){
    var li=document.createElement("li");li.className="tx";
    var m=document.createElement("div");m.className="m";
    var b1=document.createElement("b");b1.textContent=t.n||t.c;
    var s=document.createElement("small");s.textContent=t.c+" • "+t.d;
    m.appendChild(b1);m.appendChild(s);
    var a=document.createElement("div");a.className="a "+(t.k==="out"?"neg":"pos");a.textContent=(t.k==="out"?"-":"+")+fmt(t.a);
    var x=document.createElement("button");x.type="button";x.textContent="Delete";x.setAttribute("aria-label","Entry delete karein");
    x.addEventListener("click",function(){delTx(t.id)});
    li.appendChild(m);li.appendChild(a);li.appendChild(x);ul.appendChild(li);
  });
}

/* ---------- SETTINGS ---------- */
function saveSettings(){
  var users=lsGet("dh_users",{}),nm=$("sName").value.trim()||me;
  if(users[me]){users[me].name=nm;lsSet("dh_users",users)}
  data.cur=$("sCur").value;data.budget=Math.max(0,parseFloat($("sBud").value)||0);
  saveData();$("hello").textContent="Salam, "+nm;
  $("sMsg").className="err ok";$("sMsg").textContent="Settings save ho gayin ✓";
}
async function changePass(){
  var users=lsGet("dh_users",{}),m=$("pMsg");m.className="err";
  if(users[me].h!==await hash($("pOld").value)){m.textContent="Purana password ghalat hai.";return}
  if($("pNew").value.length<4){m.textContent="Naya password kam az kam 4 harf ka ho.";return}
  users[me].h=await hash($("pNew").value);lsSet("dh_users",users);
  $("pOld").value="";$("pNew").value="";m.className="err ok";m.textContent="Password badal gaya ✓";
}
function backup(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="daily-hisab-backup-"+today()+".json";
  document.body.appendChild(a);a.click();a.remove();
}
function clearAll(){
  if(!confirm("Saari entries hamesha ke liye delete ho jayengi. Pakka?"))return;
  data.tx=[];saveData();render();toast("Saari entries delete");
}

/* ---------- EVENTS ---------- */
$("tLogin").addEventListener("click",function(){setMode("login")});
$("tSign").addEventListener("click",function(){setMode("signup")});
$("aGo").addEventListener("click",doAuth);
["aName","aUser","aPass","aPass2"].forEach(function(i){$(i).addEventListener("keydown",function(e){if(e.key==="Enter")doAuth()})});
$("bOut").addEventListener("click",logout);
$("bSet").addEventListener("click",showSet);$("sBack").addEventListener("click",showHome);
$("kOut").addEventListener("click",function(){setKind("out")});$("kIn").addEventListener("click",function(){setKind("in")});
$("xAdd").addEventListener("click",addTx);
$("xNote").addEventListener("keydown",function(e){if(e.key==="Enter")addTx()});
$("fMonth").addEventListener("change",render);
$("sSave").addEventListener("click",saveSettings);$("pSave").addEventListener("click",changePass);
$("dBack").addEventListener("click",backup);$("dClear").addEventListener("click",clearAll);

var s=lsGet("dh_session",null),users=lsGet("dh_users",{});
if(s&&users[s])start(s);else{$("auth").classList.remove("hide");setMode(Object.keys(users).length?"login":"signup")}
})();
</script>
</body>
</html>
