<style>
:root{--bg:#eef3f0;--card:#fff;--ink:#14201b;--mute:#5d6f67;--line:#d9e3de;--green:#0f4c3a;--green2:#1b7a5c;--gold:#c8962e;--red:#c0392b;--ok:#1b7a5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1612;--card:#16231d;--ink:#e8f1ec;--mute:#93a79d;--line:#27382f;--green:#2fa57d;--green2:#3cc195}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Noto Naskh Arabic",sans-serif;min-height:100vh}
html[lang=ur] body{line-height:1.95}html[lang=hi] body{line-height:1.7}html[lang=ar] body{line-height:1.75}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 96px}
.hide{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h1,h2,h3{margin:0}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--green);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button.danger{background:var(--red)}
button.full{width:100%;margin-top:14px}
.err{color:var(--red);font-size:14px;min-height:22px;margin-top:8px}.err.ok{color:var(--ok)}
#auth{min-height:100vh;display:flex;align-items:center}#auth .wrap{width:100%;padding-bottom:20px}
.brand{text-align:center;margin-bottom:16px}.brand svg{width:84px;height:84px}
.brand h1{font-size:28px;margin-top:8px;color:var(--green)}.brand p{margin:2px 0 0;color:var(--mute)}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:6px}
.tabs button{flex:1;background:transparent;color:var(--mute)}.tabs button.on{background:var(--green);color:#fff}
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
.top svg{width:38px;height:38px;flex:none}.top h2{flex:1;font-size:19px}
.top small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.top button{padding:9px 12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.sum span{font-size:12.5px;color:var(--mute)}
.sum b{display:block;font-size:19px;margin-top:2px;direction:ltr;unicode-bidi:isolate;text-align:left}
[dir=rtl] .sum b{text-align:right}
.legend b,li.tx .a,#bTxt{direction:ltr;unicode-bidi:isolate}
.neg{color:var(--red)}.pos{color:var(--ok)}
.bar{height:12px;background:var(--bg);border-radius:8px;overflow:hidden;margin:10px 0 6px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--green2);width:0;transition:width .3s}
.bar i.warn{background:var(--gold)}.bar i.over{background:var(--red)}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:transparent;color:var(--mute);border:1.5px solid var(--line)}
.seg button.on{background:var(--red);color:#fff;border-color:var(--red)}
.seg button.inc.on{background:var(--ok);border-color:var(--ok)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
ul{list-style:none;margin:0;padding:0}
li.tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
li.tx:last-child{border:0}
li.tx .m{flex:1;min-width:0}
li.tx .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li.tx .m small{color:var(--mute)}
li.tx .a{font-weight:700;white-space:nowrap}
li.tx button{padding:7px 10px;background:transparent;color:var(--red);border:1.5px solid var(--line);font-size:14px}
.empty{color:var(--mute);text-align:center;padding:18px 0}
.sethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ringbox{display:flex;flex-direction:column;align-items:center;gap:12px}
.ringbox svg{width:min(250px,72vw);height:auto;overflow:visible}
.ringbox circle{fill:none;transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.trk{stroke:var(--line)}#rInc{stroke:var(--green2)}#rOut{stroke:var(--red)}
.rtxt{fill:var(--ink);text-anchor:middle;font-family:inherit}
.rsub{fill:var(--mute);text-anchor:middle;font-size:10.5px;font-family:inherit}
.legend{width:100%;display:grid;gap:8px}
.legend div{display:flex;align-items:center;gap:10px;font-size:14.5px}
.legend i{width:12px;height:12px;border-radius:50%;flex:none}
.legend span{flex:1;color:var(--mute)}.legend b{white-space:nowrap}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
#nav button{flex:1;background:transparent;color:var(--mute);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:20px;line-height:1.3;border-radius:10px}
#nav button small{font-size:11.5px;font-weight:600}
#nav button.on{color:var(--green);background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.ringbox circle,.bar i{transition:none}}
#rep{display:none}
@media print{body>*:not(#rep){display:none!important}body{background:#fff}#rep{display:block;color:#000;background:#fff;padding:8px;font-size:14px;line-height:1.6}#rep h2{margin:0 0 4px}#rep table{width:100%;border-collapse:collapse;margin-top:12px}#rep th,#rep td{border:1px solid #888;padding:5px 7px;text-align:start}#rep .n{direction:ltr;unicode-bidi:isolate;white-space:nowrap}#rep tfoot td{font-weight:700}}
</style>
</head>

c_bills:["Bills","بل","बिल","فواتير"],
c_travel:["Travel","سفر","सफ़र","سفر"],
c_clothes:["Clothes","کپڑے","कपड़े","ملابس"],
c_health:["Health","صحت","सेहत","صحة"],
c_edu:["Education","تعلیم","पढ़ाई","تعليم"],
c_mobile:["Mobile / internet","موبائل / انٹرنیٹ","मोबाइल / इंटरनेट","هاتف / إنترنت"],
c_kids:["Kids","بچوں کا","बच्चों का","الأطفال"],

c_other:["Other","دیگر","अन्य","أخرى"],

c_biz:["Business","کاروبار","कारोबार","تجارة"],

c_gift:["Gift","تحفہ","तोहफ़ा","هدية"]
};
function t(k){return T[k]?T[k][L]:k}
var CATS={out:["food","rent","bills","travel","clothes","health","edu","mobile","kids","loan","other"],in:["sal","biz","back","gift","other"]};
var LEG={"Khana":"food","Ghar/Kiraya":"rent","Bijli/Gas/Pani":"bills","Safar":"travel","Kapre":"clothes","Sehat":"health","Taleem":"edu","Mobile/Internet":"mobile","Bachon ka":"kids","Udhaar":"loan","Other":"other","Tankhwah":"sal","Karobar":"biz","Udhaar wapsi":"back","Gift":"gift"};
function cl(c){var k=LEG[c]||c;return T["c_"+k]?T["c_"+k][L]:c}

var kind="out",me=null,data=null,authMode="login",page="Dash";
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function toast(s){var e=$("toast");e.textContent=s;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},1800)}
function fmt(n){return (data?data.cur:"Rs")+" "+Number(n).toLocaleString("en-US",{maximumFractionDigits:2})}
async function hash(p){
  try{if(window.crypto&&crypto.subtle){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("dh:"+p));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}}catch(e){}
  return "b:"+btoa(unescape(encodeURIComponent("dh:"+p)));
}
function saveData(){lsSet("dh_data_"+me,data)}
function uname(){var u=lsGet("dh_users",{});return (me&&u[me]&&u[me].name)||me||""}

/* ---------- LANGUAGE APPLY ---------- */
function applyLang(){
  var h=document.documentElement;h.lang=LC[L];h.dir=(L===1||L===3)?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.dataset.i)});
  document.querySelectorAll("[data-p]").forEach(function(e){e.placeholder=t(e.dataset.p)});
  $("aLang").value=LC[L];$("sLang").value=LC[L];
  setKind(kind);
  if(me){$("hello").textContent=t("hello")+" "+uname();render()}
}
function setLang(c){L=Math.max(0,LC.indexOf(c));lsSet("dh_lang",LC[L]);applyLang()}

/* ---------- AUTH ---------- */
function setMode(m){
  authMode=m;var s=m==="signup";
  $("tLogin").classList.toggle("on",!s);$("tSign").classList.toggle("on",s);
  $("nameBox").classList.toggle("hide",!s);$("passBox").classList.toggle("hide",!s);
  $("aGo").dataset.i=s?"goSign":"goLogin";$("aGo").textContent=t(s?"goSign":"goLogin");
  $("aPass").autocomplete=s?"new-password":"current-password";$("aErr").textContent="";
}
async function doAuth(){
  var u=$("aUser").value.trim().toLowerCase(),p=$("aPass").value,err=$("aErr");err.textContent="";
  if(!u){err.textContent=t("eUser");return}
  if(!/^[a-z0-9_.]{3,20}$/.test(u)){err.textContent=t("eFmt");return}
  if(p.length<4){err.textContent=t("ePass");return}
  var users=lsGet("dh_users",{});
  if(authMode==="signup"){
    if(users[u]){err.textContent=t("eExists");return}
    if(p!==$("aPass2").value){err.textContent=t("eMatch");return}
    var nm=$("aName").value.trim()||u;
    users[u]={h:await hash(p),name:nm};lsSet("dh_users",users);
    lsSet("dh_data_"+u,{tx:[],budget:0,cur:"Rs"});
  }else{
    if(!users[u]){err.textContent=t("eNoUser");return}
    if(users[u].h!==await hash(p)){err.textContent=t("eBad");return}
  }
  lsSet("dh_session",u);$("aPass").value="";$("aPass2").value="";start(u);
}
function start(u){
  me=u;data=lsGet("dh_data_"+u,null)||{tx:[],budget:0,cur:"Rs"};if(!data.tx)data.tx=[];
  $("hello").textContent=t("hello")+" "+uname();
  $("auth").classList.add("hide");$("app").classList.remove("hide");
  $("fMonth").value=today().slice(0,7);$("xDate").value=today();
  setKind("out");go("Dash");
}
function logout(){lsDel("dh_session");me=null;data=null;$("app").classList.add("hide");$("auth").classList.remove("hide");setMode("login")}

/* ---------- PAGES ---------- */
function go(p){
  page=p;["Dash","Add","Rec","Set"].forEach(function(x){$("p"+x).classList.toggle("hide",x!==p)});
  document.querySelectorAll("#nav button").forEach(function(b){b.classList.toggle("on",b.dataset.go===p)});
  $("mbar").classList.toggle("hide",p!=="Dash"&&p!=="Rec");
  if(p==="Set")fillSet();else render();
  window.scrollTo(0,0);
}
function fillSet(){
  $("sName").value=uname();$("sCur").value=data.cur||"Rs";$("sBud").value=data.budget||"";$("sLang").value=LC[L];
  $("sMsg").textContent="";$("pMsg").textContent="";
}

/* ---------- ENTRIES ---------- */
function setKind(k){
  kind=k;$("kOut").classList.toggle("on",k==="out");$("kIn").classList.toggle("on",k==="in");
  var s=$("xCat"),old=s.value;s.innerHTML="";
  CATS[k].forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=cl(c);s.appendChild(o)});
  if(old&&CATS[k].indexOf(old)>-1)s.value=old;
}
function addTx(){
  var amt=parseFloat($("xAmt").value),err=$("xErr");err.textContent="";
  if(!(amt>0)){err.textContent=t("eAmt");$("xAmt").focus();return}
  var d=$("xDate").value||today();
  data.tx.push({id:Date.now()+""+Math.floor(Math.random()*1000),k:kind,a:amt,c:$("xCat").value,n:$("xNote").value.trim(),d:d});
  saveData();$("xAmt").value="";$("xNote").value="";$("xDate").value=today();$("fMonth").value=d.slice(0,7);
  toast(t("saved"));
}
function delTx(id){
  if(!confirm(t("cDel")))return;
  data.tx=data.tx.filter(function(x){return x.id!==id});saveData();render();toast(t("deld"));
}
function drawRing(inc,out,b){
  var C1=2*Math.PI*86,C2=2*Math.PI*62,tot=inc+out,gap=(inc>0&&out>0)?4:0;
  var li=tot?inc/tot*C1:0,lo=tot?out/tot*C1:0;
  $("rInc").setAttribute("stroke-dasharray",Math.max(0,li-gap)+" "+C1);
  $("rOut").setAttribute("stroke-dasharray",Math.max(0,lo-gap)+" "+C1);
  $("rOut").setAttribute("stroke-dashoffset",-li);
  var bp=b>0?Math.min(1,out/b):0,rb=$("rBud");
  rb.setAttribute("stroke-dasharray",bp*C2+" "+C2);rb.setAttribute("stroke",b>0&&out>=b?"var(--red)":"var(--gold)");
  var net=inc-out,s=fmt(net),n=$("rNet");
  $("rLbl").textContent=t("bal");
  n.textContent=s;n.setAttribute("font-size",s.length>12?11:s.length>9?13.5:17);n.style.fill=net<0?"var(--red)":"var(--ink)";
  $("rSub").textContent=tot?t(net<0?"subNeg":"subOk"):t("subNone");
  $("lInc").textContent=fmt(inc)+(tot?" ("+Math.round(inc/tot*100)+"%)":"");
  $("lOut").textContent=fmt(out)+(tot?" ("+Math.round(out/tot*100)+"%)":"");
  $("lBud").textContent=b>0?Math.round(out/b*100)+"%":t("notSet");
}
function render(){
  if(!data)return;
  var m=$("fMonth").value||today().slice(0,7),t0=today(),out=0,inc=0,td=0,mtx=[];
  data.tx.forEach(function(x){
    if(x.d.slice(0,7)===m){mtx.push(x);if(x.k==="out")out+=x.a;else inc+=x.a}
    if(x.k==="out"&&x.d===t0)td+=x.a;
  });
  $("sOut").textContent=fmt(out);$("sIn").textContent=fmt(inc);$("sToday").textContent=fmt(td);
  var net=inc-out,sn=$("sNet");sn.textContent=fmt(net);sn.className=net<0?"neg":"pos";
  var b=Number(data.budget)||0,bar=$("bBar");
  drawRing(inc,out,b);
  if(b>0){
    var p=out/b*100;bar.style.width=Math.min(100,p)+"%";bar.className=p>=100?"over":p>=80?"warn":"";
    $("bTxt").textContent=fmt(out)+" / "+fmt(b);
    $("bMsg").textContent=p>=100?t("budOver")+" "+fmt(out-b):fmt(b-out)+" "+t("budLeft")+" ("+Math.round(p)+"%)";
  }else{bar.style.width="0";$("bTxt").textContent="";$("bMsg").textContent=t("budNone")}
  var ul=$("list");ul.innerHTML="";
  mtx.sort(function(a,c){return a.d<c.d?1:a.d>c.d?-1:(c.id<a.id?-1:1)});
  if(!mtx.length){var e=document.createElement("div");e.className="empty";e.textContent=t("empty");ul.appendChild(e);return}
  mtx.forEach(function(x){
    var li=document.createElement("li");li.className="tx";
    var mm=document.createElement("div");mm.className="m";
    var b1=document.createElement("b");b1.textContent=x.n||cl(x.c);
    var s=document.createElement("small");s.textContent=cl(x.c)+" • "+x.d;
    mm.appendChild(b1);mm.appendChild(s);
    var a=document.createElement("div");a.className="a "+(x.k==="out"?"neg":"pos");a.textContent=(x.k==="out"?"-":"+")+fmt(x.a);
    var bt=document.createElement("button");bt.type="button";bt.textContent=t("del");
    bt.addEventListener("click",function(){delTx(x.id)});
    li.appendChild(mm);li.appendChild(a);li.appendChild(bt);ul.appendChild(li);
  });
}

/* ---------- SETTINGS ---------- */
function saveSettings(){
  var users=lsGet("dh_users",{}),nm=$("sName").value.trim()||me;
  if(users[me]){users[me].name=nm;lsSet("dh_users",users)}
  data.cur=$("sCur").value;data.budget=Math.max(0,parseFloat($("sBud").value)||0);saveData();
  $("hello").textContent=t("hello")+" "+nm;
  $("sMsg").className="err ok";$("sMsg").textContent=t("savedS");
}
async function changePass(){
  var users=lsGet("dh_users",{}),m=$("pMsg");m.className="err";
  if(users[me].h!==await hash($("pOld").value)){m.textContent=t("ePold");return}
  if($("pNew").value.length<4){m.textContent=t("ePass");return}
  users[me].h=await hash($("pNew").value);lsSet("dh_users",users);
  $("pOld").value="";$("pNew").value="";m.className="err ok";m.textContent=t("pDone");
}
function backup(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="daily-hisab-backup-"+today()+".json";
  document.body.appendChild(a);a.click();a.remove();
}
function clearAll(){if(!confirm(t("cClr")))return;data.tx=[];saveData();render();toast(t("cld"))}


/* ---------- EXPORT / REPORT / RESTORE ---------- */
function dl(name,text,type){var b=new Blob([text],{type:type}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600)}
function byDate(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.id<b.id?-1:1)}
function csvCell(v){v=String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function dMsg(k,ok){var e=$("dMsg");e.className="err"+(ok?" ok":"");e.textContent=k}
function exportCsv(){
  if(!data.tx.length){dMsg(t("noTx"));return}
  dMsg("");
  var L1=[[t("date"),t("rType"),t("cat"),t("rNote"),t("amt")+" ("+data.cur+")"].map(csvCell).join(",")];
  data.tx.slice().sort(byDate).forEach(function(x){
    L1.push([x.d,t(x.k==="out"?"exp":"inc"),cl(x.c),x.n||"",x.a].map(csvCell).join(","))});
  dl("daily-hisab-"+today()+".csv","\ufeff"+L1.join("\r\n"),"text/csv;charset=utf-8");
  dMsg(t("csvOk"),1);
}
function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pdfReport(){
  var m=$("fMonth").value||today().slice(0,7),rows=data.tx.filter(function(x){return x.d.slice(0,7)===m}).sort(byDate);
  if(!rows.length){dMsg(t("empty"));return}
  var inc=0,out=0;rows.forEach(function(x){if(x.k==="out")out+=x.a;else inc+=x.a});
  var h='<h2>Daily Hisab</h2><div>'+esc(uname())+' &middot; <span class="n">'+esc(m)+'</span></div><table><thead><tr><th>'+esc(t("date"))+'</th><th>'+esc(t("cat"))+'</th><th>'+esc(t("rNote"))+'</th><th>'+esc(t("amt"))+'</th></tr></thead><tbody>';
  rows.forEach(function(x){h+='<tr><td class="n">'+esc(x.d)+'</td><td>'+esc(cl(x.c))+'</td><td>'+esc(x.n||"")+'</td><td class="n">'+(x.k==="out"?"-":"+")+esc(fmt(x.a))+'</td></tr>'});
  h+='</tbody><tfoot><tr><td colspan="3">'+esc(t("inc"))+'</td><td class="n">'+esc(fmt(inc))+'</td></tr><tr><td colspan="3">'+esc(t("exp"))+'</td><td class="n">'+esc(fmt(out))+'</td></tr><tr><td colspan="3">'+esc(t("bal"))+'</td><td class="n">'+esc(fmt(inc-out))+'</td></tr></tfoot></table>';
  $("rep").innerHTML=h;dMsg(t("pdfHint"),1);
  setTimeout(function(){window.print()},400);
}
function restoreFile(f){
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);if(Array.isArray(o))o={tx:o};
      if(!o||!Array.isArray(o.tx))throw 0;
      var have={};data.tx.forEach(function(x){have[x.id]=1});
      var add=[];
      o.tx.forEach(function(x,i){
        if(!x||(x.k!=="in"&&x.k!=="out")||!(Number(x.a)>0)||!/^\d{4}-\d{2}-\d{2}$/.test(String(x.d)))return;
        var id=String(x.id||(Date.now()+"r"+i));if(have[id])return;have[id]=1;
        add.push({id:id,k:x.k,a:Number(x.a),c:String(x.c||"other"),n:String(x.n||""),d:String(x.d)});
      });
      if(!add.length){dMsg(t("rNone"),1);return}
      if(!confirm(add.length+" "+t("rAsk")))return;
      data.tx=data.tx.concat(add);
      if(!(Number(data.budget)>0)&&Number(o.budget)>0)data.budget=Number(o.budget);
      saveData();render();dMsg(add.length+" "+t("rDone"),1);
    }catch(e){dMsg(t("rBad"))}
  };
  r.readAsText(f);
}
